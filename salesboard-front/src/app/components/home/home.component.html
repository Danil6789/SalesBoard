<div class="hero-section">
  <h2>Добро пожаловать на Salesboard!</h2>
  <p>Покупайте и продавайте товары в элитном стиле</p>
  
  <div class="buttons">
    <a routerLink="/adverts" class="btn btn-primary">
      <i class="bi bi-grid-3x3-gap-fill"></i>
      Смотреть объявления
    </a>
    <a routerLink="/register" *ngIf="!isLoggedIn" class="btn">
      <i class="bi bi-plus-circle"></i>
      Начать продавать
    </a>
  </div>
  
  <div class="features">
    <div class="feature">
      <i class="bi bi-lightning-charge-fill"></i>
      <h3>Быстро</h3>
      <p>Размести объявление за 2 минуты в пару кликов</p>
    </div>
    <div class="feature">
      <i class="bi bi-brush-fill"></i>
      <h3>Элитно</h3>
      <p>Минималистичный дизайн премиум-класса</p>
    </div>
    <div class="feature">
      <i class="bi bi-shield-check"></i>
      <h3>Безопасно</h3>
      <p>Проверенные пользователи и безопасные сделки</p>
    </div>
  </div>
</div>
